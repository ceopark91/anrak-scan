name: AnrakScan
options:
  bundleIdPrefix: com.anrak
  deploymentTarget:
    iOS: "17.0"
targets:
  AnrakScan:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 안락 실측
        CFBundleShortVersionString: "1.9.1"
        CFBundleVersion: "15"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 라이다·카메라로 방을 스캔하고 치수를 잽니다.
        NSPhotoLibraryUsageDescription: 도면 사진을 불러옵니다.
        NSBluetoothAlwaysUsageDescription: 블루투스 레이저 측정기(라이카 DISTO)에서 잰 값을 받습니다.
        CFBundleURLTypes:
          - CFBundleURLName: com.anrak.scan
            CFBundleURLSchemes: [anrakscan]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anrak.scan
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
