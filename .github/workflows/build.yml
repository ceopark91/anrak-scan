name: 안락 스캔 빌드
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 선택
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true; xcodebuild -version
      - name: 프로젝트 만들기
        run: brew install xcodegen && xcodegen generate
      - name: 빌드 (서명 없이)
        run: |
          set -o pipefail
          xcodebuild -project AnrakScan.xcodeproj -scheme AnrakScan -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | grep -E 'error:|warning: unre|BUILD' || true
          test -f build/Build/Products/Release-iphoneos/AnrakScan.app/AnrakScan
      - name: IPA 묶기
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/AnrakScan.app Payload/
          zip -qry AnrakScan.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AnrakScan-ipa
          path: AnrakScan.ipa
      - name: 최신 설치 파일 올리기 (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest AnrakScan.ipa --title "안락 스캔 최신 빌드" --notes "빌드 ${{ github.run_number }} · $(git rev-parse --short HEAD)" --latest
